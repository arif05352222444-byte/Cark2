name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Proje klasörünü bul
        shell: bash
        run: |
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then
            Z=$(find . -name '*.zip' -not -path './.git/*' | head -1)
            if [ -n "$Z" ]; then
              unzip -q -o "$Z" -d _proje
              F=$(find ./_proje -name settings.gradle.kts | head -1)
            fi
          fi
          if [ -z "$F" ]; then
            echo "::error::Proje dosyalari yok"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$F")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Derle ve test et
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug testDebugUnitTest --continue 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Hata ozeti
        if: failure()
        shell: bash
        run: |
          echo "## Hatalar" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |What went wrong|FAILED|Unresolved|error:" "$GITHUB_WORKSPACE/build.log" | head -80 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: AileCarki-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
